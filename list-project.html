document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ound\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div style=\"position: absolute; top: calc(100% + 10px); right: 0; width: 224px; background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 14px; box-shadow: 0 20px 44px -16px rgba(42,34,25,.4); padding: 7px; display: grid; gap: 2px; z-index: 70;\">\n          <a href=\"/list-project#login\" style=\"padding: 13px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #272019; display: block;\" style-hover=\"background: #F4ECE0; color: #8A5424;\">Sauna owner log in<\u002Fa>\n          <a href=\"/contractors#login\" style=\"padding: 13px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #272019; display: block;\" style-hover=\"background: #F4ECE0; color: #8A5424;\">Contractor log in<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main data-m=\"main\" style=\"flex: 1; padding: 46px 0 90px;\">\n    <div data-m=\"wrap\" style=\"max-width: 1180px; margin: 0 auto; padding: 0 28px;\">\n\n      <div style=\"max-width: 760px; margin: 0 auto 44px; display: {{ railDisplay }}; align-items: center;\">\n        <sc-for list=\"{{ rail }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; align-items: center; flex: {{ r.flex }}; min-width: 0;\">\n            <div style=\"display: flex; align-items: center; gap: 11px; flex: none;\">\n              <span style=\"width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 14.5px; font-weight: 700; background: {{ r.bg }}; color: {{ r.fg }}; border: 1px solid {{ r.bd }};\">{{ r.num }}<\u002Fspan>\n              <span style=\"font-size: 14.5px; font-weight: 600; color: {{ r.labelFg }}; white-space: nowrap;\">{{ r.label }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"height: 2px; flex: 1; min-width: 18px; margin: 0 14px; border-radius: 2px; background: {{ r.line }}; display: {{ r.lineDisplay }};\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isLogin }}\">\n        <div style=\"max-width: 470px; margin: 30px auto 0; animation: fade .25s ease;\">\n          <span style=\"font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8A5424; display: inline-flex; align-items: center; gap: 9px;\"><span style=\"width: 18px; height: 2px; background: #8A5424; border-radius: 2px;\"><\u002Fspan>Sauna owner log in<\u002Fspan>\n          <h1 style=\"font-size: clamp(28px, 3.8vw, 38px); margin: 16px 0 0; letter-spacing: -.03em; line-height: 1.05; font-weight: 700;\">Welcome back, Sauna Owner.<\u002Fh1>\n          <p style=\"font-size: 17.5px; color: #6B6253; margin: 12px 0 0;\">Log in to review the proposals installers have sent for your project.<\u002Fp>\n\n          <div data-m=\"pad2\" style=\"margin-top: 26px; background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 22px; padding: 30px; box-shadow: 0 10px 30px -12px rgba(42,34,25,.22), 0 2px 6px rgba(42,34,25,.06);\">\n            <div>\n              <label style=\"display: block; font-size: 13.5px; font-weight: 600; color: #272019; margin-bottom: 7px;\">Email<span style=\"color: #C0492F; font-weight: 700;\"> *<\u002Fspan><\u002Flabel>\n              <input type=\"email\" placeholder=\"you@email.com\" value=\"{{ loginEmailVal }}\" sc-camel-on-change=\"{{ loginEmailOn }}\" sc-camel-on-key-down=\"{{ loginKeyDown }}\" style=\"width: 100%; font-family: inherit; font-size: 16px; color: #272019; background: #FCF8F1; border: 1px solid {{ loginEmailBd }}; border-radius: 11px; padding: 13px 14px;\">\n              <span style=\"display: {{ loginEmailErr }}; color: #C0492F; font-size: 12.5px; margin-top: 6px; font-weight: 600;\">{{ loginEmailMsg }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top: 14px;\">\n              <label style=\"display: block; font-size: 13.5px; font-weight: 600; color: #272019; margin-bottom: 7px;\">Password<span style=\"color: #C0492F; font-weight: 700;\"> *<\u002Fspan><\u002Flabel>\n              <input type=\"password\" placeholder=\"••••••••\" value=\"{{ loginPassVal }}\" sc-camel-on-change=\"{{ loginPassOn }}\" sc-camel-on-key-down=\"{{ loginKeyDown }}\" style=\"width: 100%; font-family: inherit; font-size: 16px; color: #272019; background: #FCF8F1; border: 1px solid {{ loginPassBd }}; border-radius: 11px; padding: 13px 14px;\">\n              <span style=\"display: {{ loginPassErr }}; color: #C0492F; font-size: 12.5px; margin-top: 6px; font-weight: 600;\">{{ loginPassMsg }}<\u002Fspan>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ submitLogin }}\" style=\"width: 100%; margin-top: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid transparent; padding: 16px 28px; background: #8A5424; color: #fff;\" style-hover=\"background: #6F421A;\">\n              Log in to my dashboard\n              <svg sc-camel-view-box=\"0 0 20 20\" fill=\"none\" style=\"width: 17px; height: 17px;\"><path d=\"M4 10h12M11 5l5 5-5 5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <p style=\"font-size: 13.5px; color: #8A8071; margin: 16px 0 0; text-align: center;\">No project yet? <button type=\"button\" sc-camel-on-click=\"{{ goAccount }}\" style=\"font-family: inherit; font-size: 13.5px; font-weight: 600; color: #8A5424; background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;\">List a project<\u002Fbutton><\u002Fp>\n          <\u002Fdiv>\n          <p style=\"font-size: 13px; color: #8A8071; margin: 16px 0 0; text-align: center;\">We only use your email information to send proposals.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDash }}\">\n        <div style=\"animation: fade .25s ease;\">\n          <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n            <div>\n              <span style=\"font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8A5424; display: inline-flex; align-items: center; gap: 9px;\"><span style=\"width: 18px; height: 2px; background: #8A5424; border-radius: 2px;\"><\u002Fspan>My project<\u002Fspan>\n              <h1 style=\"font-size: clamp(28px, 3.6vw, 40px); margin: 14px 0 0; letter-spacing: -.03em; line-height: 1.05; font-weight: 700;\">{{ dashHeading }}<\u002Fh1>\n              <p style=\"font-size: 17px; color: #6B6253; margin: 12px 0 0;\">Compare fixed-price proposals from verified installers near you. No obligation and no fee, whatever you decide.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ goAccount }}\" style=\"display: inline-flex; align-items: center; gap: 9px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid transparent; padding: 14px 24px; background: #8A5424; color: #fff;\" style-hover=\"background: #6F421A;\">\n              List another project\n              <svg sc-camel-view-box=\"0 0 20 20\" fill=\"none\" style=\"width: 16px; height: 16px;\"><path d=\"M4 10h12M11 5l5 5-5 5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div data-m=\"g2\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 30px;\">\n            <sc-for list=\"{{ stats }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 18px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(42,34,25,.06);\">\n                <div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8A8071;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-top: 8px; color: {{ k.fg }};\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 13.5px; color: #6B6253; margin-top: 2px;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div data-m=\"stack\" style=\"display: grid; grid-template-columns: 1.45fr .55fr; gap: 24px; margin-top: 24px; align-items: start;\">\n            <div style=\"background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 22px; padding: 8px 26px 26px;\">\n              <div style=\"display: flex; align-items: center; gap: 10px; padding: 20px 0 14px; border-bottom: 1px solid #E4D8C5; flex-wrap: wrap;\">\n                <h2 style=\"font-size: 21px; margin: 0; letter-spacing: -.025em; font-weight: 700;\">Proposals received<\u002Fh2>\n                <span style=\"font-size: 12.5px; font-weight: 700; color: #8A5424; background: #EFE0CC; border: 1px solid #E0CBA8; padding: 3px 10px; border-radius: 999px;\">{{ proposalCount }} total<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ proposals }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div data-m=\"fields\" style=\"display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: start; padding: 22px 0; border-bottom: 1px solid #F0E6D6;\">\n                  <div style=\"min-width: 0;\">\n                    <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\">\n                      <b style=\"font-size: 17.5px; font-weight: 700; letter-spacing: -.01em;\">{{ p.company }}<\u002Fb>\n                      <span style=\"font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: {{ p.pillFg }}; background: {{ p.pillBg }}; border: 1px solid {{ p.pillBd }}; padding: 3px 9px; border-radius: 999px; white-space: nowrap;\">{{ p.status }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 14px; color: #8A8071; margin-top: 5px;\">{{ p.meta }}<\u002Fdiv>\n                    <p style=\"font-size: 15px; color: #6B6253; margin: 8px 0 0; max-width: 56ch;\">{{ p.note }}<\u002Fp>\n                    <div style=\"display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ p.accept }}\" style=\"display: {{ p.acceptDisplay }}; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid transparent; padding: 11px 20px; background: #8A5424; color: #fff;\" style-hover=\"background: #6F421A;\">Accept proposal<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{ p.decline }}\" style=\"display: {{ p.declineDisplay }}; align-items: center; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid #D8C8AF; padding: 11px 20px; background: transparent; color: #272019;\" style-hover=\"background: #F4ECE0;\">Decline<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{ p.complete }}\" style=\"display: {{ p.completeDisplay }}; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid #CFE3D3; padding: 11px 20px; background: #E9F1EA; color: #3E7A4E;\" style-hover=\"background: #DDEBE0;\">Mark project completed<\u002Fbutton>\n                      <span style=\"display: {{ p.doneDisplay }}; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: #3E7A4E;\">\n                        <svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" style=\"width: 14px; height: 14px;\"><path d=\"M3 8.5l3.2 3.2L13 5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                        Completed · payment released by ACH\n                      <\u002Fspan>\n                      <span style=\"display: {{ p.doneDisplay }}; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8A5424;\">· Your review: <span style=\"color: #C98A2B; letter-spacing: 1px;\">{{ p.reviewStars }}<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align: right; flex: none;\">\n                    <div style=\"font-size: 23px; font-weight: 800; letter-spacing: -.02em; color: #272019;\">{{ p.amount }}<\u002Fdiv>\n                    <div style=\"font-size: 13px; color: #8A8071;\">start {{ p.start }}<\u002Fdiv>\n                    <div style=\"font-size: 13px; color: #8A8071; margin-top: 5px;\">{{ p.rating }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <p style=\"font-size: 14.5px; color: #8A8071; margin: 20px 0 0;\">Proposals keep arriving for about a week after a project goes live. You'll get an email each time one lands.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; gap: 16px;\">\n              <div style=\"background: #F4ECE0; border: 1px solid #D8C8AF; border-radius: 22px; padding: 24px;\">\n                <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8A8071;\">Your listing<\u002Fdiv>\n                <div style=\"font-size: 19px; font-weight: 700; margin-top: 10px; letter-spacing: -.02em;\">{{ dashTitle }}<\u002Fdiv>\n                <div style=\"display: grid; gap: 9px; margin-top: 16px; font-size: 14.5px;\">\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Type<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ dashType }}<\u002Fb><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Brand &amp; model<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ dashModel }}<\u002Fb><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Power<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ dashPower }}<\u002Fb><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Electrician<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ elecSummary }}<\u002Fb><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Capacity<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ dashSize }}<\u002Fb><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Install date<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ dashDate }}<\u002Fb><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; gap: 14px;\"><span style=\"color: #8A8071;\">Location<\u002Fspan><b style=\"font-weight: 600; text-align: right;\">{{ dashLoc }}<\u002Fb><\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"font-size: 13px; color: #8A8071; margin: 16px 0 0; padding-top: 14px; border-top: 1px solid #D8C8AF;\">{{ projectId }} · posted 3 days ago<\u002Fp>\n              <\u002Fdiv>\n\n              <div style=\"background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 22px; padding: 24px;\">\n                <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8A5424;\">Project process<\u002Fdiv>\n                <div style=\"margin-top: 16px; display: grid; gap: 2px;\">\n                  <sc-for list=\"{{ dashStages }}\" as=\"st\" hint-placeholder-count=\"5\">\n                    <div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 12px;\">\n                      <div style=\"display: flex; flex-direction: column; align-items: center;\">\n                        <span style=\"width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; background: {{ st.dotBg }}; border: 2px solid {{ st.dotBd }}; color: #FFFDF9; font-size: 11px; font-weight: 800;\">{{ st.mark }}<\u002Fspan>\n                        <span style=\"width: 2px; flex: 1; min-height: 18px; background: {{ st.line }}; display: {{ st.lineDisplay }};\"><\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"padding-bottom: 16px;\">\n                        <b style=\"font-size: 15px; font-weight: 700; color: {{ st.titleFg }};\">{{ st.title }}<\u002Fb>\n                        <p style=\"color: #8A8071; font-size: 13.5px; margin: 2px 0 0;\">{{ st.body }}<\u002Fp>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background: #2A2219; color: #F4ECE0; border-radius: 22px; padding: 24px;\">\n                <div style=\"font-size: 16.5px; font-weight: 700; color: #FCF8F1;\">Need to change something?<\u002Fdiv>\n                <p style=\"font-size: 14.5px; color: #C9BCA7; margin: 8px 0 18px;\">Edit your specs or install date any time before you accept a proposal.<\u002Fp>\n                <button type=\"button\" sc-camel-on-click=\"{{ editProject }}\" style=\"width: 100%; font-family: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid #4E4030; padding: 13px 20px; background: transparent; color: #F4ECE0;\" style-hover=\"background: #352B20;\">Edit project details<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPay }}\">\n        <div style=\"max-width: 720px; margin: 10px auto 0; animation: fade .25s ease;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goDash }}\" style=\"display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 14.5px; font-weight: 600; color: #8A5424; background: none; border: none; padding: 0; cursor: pointer;\">\n            <svg sc-camel-view-box=\"0 0 20 20\" fill=\"none\" style=\"width: 15px; height: 15px;\"><path d=\"M16 10H4M9 5l-5 5 5 5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            Back to my proposals\n          <\u002Fbutton>\n          <span style=\"margin-top: 22px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8A5424; display: flex; align-items: center; gap: 9px;\"><span style=\"width: 18px; height: 2px; background: #8A5424; border-radius: 2px;\"><\u002Fspan>Final step<\u002Fspan>\n          <h1 style=\"font-size: clamp(28px, 3.8vw, 40px); margin: 14px 0 0; letter-spacing: -.03em; line-height: 1.05; font-weight: 700;\">Review your installer and release payment.<\u002Fh1>\n          <p style=\"font-size: 17.5px; color: #6B6253; margin: 12px 0 0; text-wrap: pretty;\">A star rating is required to complete the project. Your review is posted to the installer's profile and helps other sauna owners choose.<\u002Fp>\n\n          <div data-m=\"pad2\" style=\"margin-top: 26px; background: #F4ECE0; border: 1px solid #D8C8AF; border-radius: 22px; padding: 24px 28px;\">\n            <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8A8071;\">Payment summary<\u002Fdiv>\n            <div style=\"display: grid; gap: 10px; margin-top: 14px; font-size: 15px;\">\n =\"width: 16px; height: 16px; flex: none;\"><path d=\"M10 4v12M4 10h12\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>List your project<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startStep&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;1 · Account&quot;,&quot;options&quot;:[&quot;1 · Account&quot;,&quot;2 · Project details&quot;,&quot;3 · Thank you&quot;,&quot;4 · Log in&quot;,&quot;5 · My proposals&quot;,&quot;6 · Review &amp; pay&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Preview&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const map = { \"1 · Account\": 0, \"2 · Project details\": 1, \"3 · Thank you\": 2, \"4 · Log in\": 3, \"5 · My proposals\": 4, \"6 · Review & pay\": 5 };\n    this.state = {\n      step: map[props.startStep] ?? 0,\n      first: \"\", last: \"\", email: \"\", phone: \"\", zip: \"\",\n      date: \"\", type: \"\", make: \"\", model: \"\", power: \"\", elec: false, seats: \"\",\n      notes: \"\", city: \"\", pzip: \"\", confirm: false,\n      loginEmail: \"\", loginPass: \"\", hiredId: map[props.startStep] === 5 ? \"c1\" : null, completedId: null, declined: [],\n      rating: 0, hoverRating: 0, reviewText: \"\", savedRating: 0,\n      err: {}\n    };\n  }\n\n  componentDidMount() {\n    if (typeof window !== \"undefined\" && window.location.hash === \"#login\") this.setState({ step: 3 });\n    fetch(this.CATALOG_URL, { cache: \"no-store\" })\n      .then(res => res.ok ? res.text() : Promise.reject(res.status))\n      .then(text => { const rows = this.parseCsv(text); if (rows.length) this.setState({ catalog: rows }); })\n      .catch(() => {});\n  }\n\n  PROPOSALS = [\n    { id: \"c1\", company: \"Northwood Sauna Co.\", meta: \"Ketchum, ID · 4.9 ★ (38 sauna installs) · sent 2 days ago\", amount: 2450, start: \"Sep 12\", rating: \"Licensed & insured\", note: \"Two-person crew, one day on site. Includes pad leveling, assembly, heater wiring to your existing 240V subpanel, and haul-away of packaging.\" },\n    { id: \"c2\", company: \"Cedar & Stone Builders\", meta: \"Hailey, ID · 4.8 ★ (21 sauna installs) · sent 2 days ago\", amount: 2890, start: \"Sep 8\", rating: \"Licensed & insured\", note: \"Earliest start date available. Includes a licensed electrician on site for the dedicated circuit, plus a cedar bench upgrade at no extra cost.\" },\n    { id: \"c3\", company: \"High Desert Wellness Installs\", meta: \"Twin Falls, ID · 4.7 ★ (54 sauna installs) · sent yesterday\", amount: 2150, start: \"Sep 22\", rating: \"Licensed & insured\", note: \"Lowest bid. Assembly and placement only — electrical to be handled by your own electrician. Two-week lead time on scheduling.\" },\n    { id: \"c4\", company: \"Alpine Heat Works\", meta: \"Sun Valley, ID · 5.0 ★ (12 sauna installs) · sent 6 hours ago\", amount: 3100, start: \"Sep 5\", rating: \"Licensed & insured\", note: \"Full turnkey: gravel pad regrade, assembly, 240V circuit run from the garage, heater commissioning, and a first-season tune-up visit included.\" }\n  ];\n\n  PSTATUS = {\n    New: { fg: \"#8A5424\", bg: \"#EFE0CC\", bd: \"#E0CBA8\" },\n    Hired: { fg: \"#3E7A4E\", bg: \"#E9F1EA\", bd: \"#CFE3D3\" },\n    Completed: { fg: \"#3E7A4E\", bg: \"#E9F1EA\", bd: \"#CFE3D3\" },\n    Declined: { fg: \"#8A8071\", bg: \"#F1EBE4\", bd: \"#E4D8C5\" },\n    \"Not selected\": { fg: \"#8A8071\", bg: \"#F1EBE4\", bd: \"#E4D8C5\" }\n  };\n\n  money(n) { return \"$\" + n.toLocaleString(\"en-US\"); }\n\n  submitLogin = () => {\n    const s = this.state, err = {};\n    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.loginEmail.trim())) err.loginEmail = \"Enter a valid email address.\";\n    if (s.loginPass.length < 6) err.loginPass = \"Enter your password.\";\n    if (Object.keys(err).length) { this.setState({ err }); return; }\n    this.setState(st => ({\n      err: {}, step: 4, loginPass: \"\",\n      first: st.first || \"Jordan\", last: st.last || \"Avery\",\n      email: st.email || st.loginEmail\n    }));\n    window.scrollTo(0, 0);\n  };\n\n  statusOf(id) {\n    const s = this.state;\n    if (s.completedId === id) return \"Completed\";\n    if (s.hiredId === id) return \"Hired\";\n    if (s.hiredId) return \"Not selected\";\n    if (s.declined.indexOf(id) !== -1) return \"Declined\";\n    return \"New\";\n  }\n\n  submitPay = () => {\n    if (!this.state.rating) { this.setState({ err: { rating: true } }); return; }\n    this.setState(st => ({ err: {}, completedId: st.hiredId, savedRating: st.rating, step: 4 }));\n    window.scrollTo(0, 0);\n  };\n\n  payVals() {\n    const s = this.state, hired = this.PROPOSALS.filter(p => p.id === s.hiredId)[0] || this.PROPOSALS[0];\n    const shown = s.hoverRating || s.rating;\n    const labels = [\"Tap a star to rate\", \"Poor\", \"Fair\", \"Good\", \"Great\", \"Excellent\"];\n    return {\n      isPay: s.step === 5,\n      payCompany: hired.company,\n      payAmount: this.money(hired.amount),\n      stars: [1, 2, 3, 4, 5].map(n => ({\n        aria: n + \" star\" + (n > 1 ? \"s\" : \"\"),\n        fg: n <= shown ? \"#C98A2B\" : \"#E4D8C5\",\n        pick: () => this.setState(st => ({ rating: n, err: Object.assign({}, st.err, { rating: false }) })),\n        hover: () => this.setState({ hoverRating: n })\n      })),\n      starLeave: () => this.setState({ hoverRating: 0 }),\n      ratingLabel: shown ? shown + \" of 5 · \" + labels[shown] : labels[0],\n      ratingLabelFg: shown ? \"#272019\" : \"#8A8071\",\n      ratingErr: s.err.rating ? \"block\" : \"none\",\n      ratingCardBd: s.err.rating ? \"#C0492F\" : \"#E4D8C5\",\n      reviewVal: s.reviewText,\n      reviewOn: ev => this.setState({ reviewText: ev.target.value }),\n      payBtnBg: s.rating ? \"#8A5424\" : \"#B89A7C\",\n      submitPay: this.submitPay\n    };\n  }\n\n  dashVals() {\n    const s = this.state;\n    const live = this.PROPOSALS.filter(p => s.declined.indexOf(p.id) === -1);\n    const proposals = this.PROPOSALS.map(p => {\n      const st = this.statusOf(p.id), c = this.PSTATUS[st];\n      return {\n        company: p.company, meta: p.meta, note: p.note, status: st,\n        amount: this.money(p.amount), start: p.start, rating: p.rating,\n        pillFg: c.fg, pillBg: c.bg, pillBd: c.bd,\n        acceptDisplay: st === \"New\" ? \"inline-flex\" : \"none\",\n        declineDisplay: st === \"New\" ? \"inline-flex\" : \"none\",\n        completeDisplay: st === \"Hired\" ? \"inline-flex\" : \"none\",\n        doneDisplay: st === \"Completed\" ? \"inline-flex\" : \"none\",\n        accept: () => this.setState({ hiredId: p.id }),\n        decline: () => this.setState(prev => ({ declined: prev.declined.concat([p.id]) })),\n        reviewStars: \"★★★★★\".slice(0, s.savedRating) + \"☆☆☆☆☆\".slice(0, 5 - s.savedRating),\n        complete: () => { this.setState({ step: 5, rating: 0, hoverRating: 0, reviewText: \"\", err: {} }); window.scrollTo(0, 0); }\n      };\n    });\n    const amounts = live.map(p => p.amount);\n    const low = amounts.length ? Math.min.apply(null, amounts) : 0;\n    const avg = amounts.length ? Math.round(amounts.reduce((a, b) => a + b, 0) / amounts.length) : 0;\n    const hired = this.PROPOSALS.filter(p => p.id === s.hiredId)[0];\n    const current = s.completedId ? 4 : s.hiredId ? 3 : 2;\n    const defs = [\n      [\"Project posted\", \"Live to verified installers in your ZIP.\"],\n      [\"Proposals arriving\", \"Fixed prices and start dates by email.\"],\n      [\"Compare proposals\", \"Review price, dates, and reviews side by side.\"],\n      [\"Installer hired\", \"Schedule the install directly with them.\"],\n      [\"Review & pay\", \"Rate your installer to release the ACH payment.\"]\n    ];\n    return {\n      proposals,\n      proposalCount: this.PROPOSALS.length,\n      dashHeading: s.completedId ? \"Your sauna install is complete.\" : hired ? hired.company + \" is installing your sauna.\" : live.length + \" proposals to review.\",\n      stats: [\n        { label: \"Proposals\", value: live.length, sub: \"from verified installers\", fg: \"#272019\" },\n        { label: \"Lowest bid\", value: this.money(low), sub: \"all-in fixed price\", fg: \"#3E7A4E\" },\n        { label: \"Average bid\", value: this.money(avg), sub: \"across your proposals\", fg: \"#272019\" },\n        { label: \"Status\", value: s.completedId ? \"Done\" : hired ? \"Hired\" : \"Open\", sub: s.completedId ? \"payment released\" : hired ? \"install scheduled\" : \"accepting proposals\", fg: \"#8A5424\" }\n      ],\n      dashStages: defs.map((d, i) => {\n        const done = i < current, active = i === current;\n        return {\n          title: d[0], body: d[1],\n          mark: done ? \"✓\" : \"\",\n          dotBg: done ? \"#8A5424\" : \"#FFFDF9\",\n          dotBd: done || active ? \"#8A5424\" : \"#E4D8C5\",\n          line: i < current ? \"#8A5424\" : \"#E4D8C5\",\n          lineDisplay: i === defs.length - 1 ? \"none\" : \"block\",\n          titleFg: done || active ? \"#272019\" : \"#8A8071\"\n        };\n      }),\n      dashTitle: (s.type || \"Traditional Sauna\") + \" install\",\n      dashType: s.type || \"Traditional Sauna\",\n      dashModel: s.model || \"Golden Designs Arosa 4-Person Barrel Sauna\",\n      dashPower: s.power || \"240V 50A dedicated circuit\",\n      dashSize: s.seats || \"4-person\",\n      dashDate: s.date || \"Sep 15, 2026\",\n      dashLoc: (s.city || \"Ketchum\") + \", \" + (s.pzip || \"83340\")\n    };\n  }\n\n  // Source: \"Claude version-svs-sauna-catalog\" sheet. One row per model: Brand|Model|Sauna Type|Capacity\n  CATALOG_SRC = \"Auroom|Auroom Baia Cabin Traditional Indoor Sauna|Traditional Sauna|\\nAuroom|Auroom Cala Wood 2-Person Indoor Traditional Sauna|Traditional Sauna|2\\nAuroom|Auroom Cala Glass Mini Traditional 1-Person Sauna|Traditional Sauna|1\\nAuroom|Auroom Cala Glass 2 Person Tra n        fg: done ? \"#FFFDF9\" : active ? \"#8A5424\" : \"#A89C88\",\n        bd: done ? \"#8A5424\" : active ? \"#D8C8AF\" : \"#E4D8C5\",\n        labelFg: done || active ? \"#272019\" : \"#A89C88\",\n        line: i < s.step ? \"#8A5424\" : \"#E4D8C5\",\n        lineDisplay: i === railDefs.length - 1 ? \"none\" : \"block\"\n      };\n    });\n\n    const stageDefs = [\n      [\"Project posted\", \"Your specs and site details are live to verified installers near you.\", 0],\n      [\"Proposals arriving\", \"Installers review your project and send fixed-price proposals by email.\", 1],\n      [\"Compare proposals\", \"Price, start date, portfolio, and reviews side by side in your inbox.\", 2],\n      [\"Hire your installer\", \"Accept the proposal you trust. Schedule directly with the contractor.\", 3],\n      [\"Install complete\", \"Mark the project completed once you're happy with the finished sauna.\", 4]\n    ];\n    const current = 1;\n    const stages = stageDefs.map(([title, body, i]) => {\n      const done = i < current, active = i === current;\n      return {\n        title, body,\n        mark: done ? \"✓\" : \"\",\n        dotBg: done ? \"#8A5424\" : active ? \"#FFFDF9\" : \"#FFFDF9\",\n        dotBd: done ? \"#8A5424\" : active ? \"#8A5424\" : \"#E4D8C5\",\n        dotFg: \"#FFFDF9\",\n        line: i < current ? \"#8A5424\" : \"#E4D8C5\",\n        lineDisplay: i === stageDefs.length - 1 ? \"none\" : \"block\",\n        titleFg: done || active ? \"#272019\" : \"#8A8071\",\n        status: done ? \"Done\" : active ? \"In progress\" : \"Up next\",\n        pillFg: done ? \"#3E7A4E\" : active ? \"#8A5424\" : \"#8A8071\",\n        pillBg: done ? \"#E9F1EA\" : active ? \"#EFE0CC\" : \"#F4ECE0\",\n        pillBd: done ? \"#CFE3D3\" : active ? \"#E0CBA8\" : \"#E4D8C5\"\n      };\n    });\n\n    const name = (s.first + \" \" + s.last).trim();\n    const sizeLine = s.seats;\n\n    return {\n      ...out,\n      isAccount: s.step === 0,\n      isProject: s.step === 1,\n      isThanks: s.step === 2,\n      isLogin: s.step === 3,\n      isDash: s.step === 4,\n      railDisplay: s.step > 2 ? \"none\" : \"flex\",\n      openLogin: () => { this.setState({ step: 3, err: {} }); window.scrollTo(0, 0); },\n      goAccount: () => { this.setState({ step: 0, err: {} }); window.scrollTo(0, 0); },\n      goDash: () => { this.setState({ step: 4, err: {} }); window.scrollTo(0, 0); },\n      submitLogin: this.submitLogin,\n      loginKeyDown: ev => { if (ev.key === \"Enter\") { ev.preventDefault(); this.submitLogin(); } },\n      loginBtnDisplay: s.step >= 4 ? \"none\" : \"inline-flex\",\n      myPropsDisplay: (s.step === 2 || s.step >= 4) ? \"inline-flex\" : \"none\",\n      ...this.dashVals(),\n      ...this.payVals(),\n      rail, stages,\n      acctName: name || \"your account\",\n      acctDisplay: (s.step > 0 && s.step !== 3 && name) ? \"inline\" : \"none\",\n      elecVal: s.elec,\n      elecOn: ev => this.set(\"elec\", ev.target.checked),\n      elecSummary: s.elec ? \"Yes — electrician needed\" : \"Not needed\",\n      confirmVal: s.confirm,\n      confirmOn: ev => this.set(\"confirm\", ev.target.checked),\n      confirmErr: e.confirm ? \"block\" : \"none\",\n      confirmMsg: e.confirm || \"\",\n      ...this.catalogVals(),\n      submitAccount: this.submitAccount,\n      submitProject: this.submitProject,\n      backToAccount: () => this.setState({ step: 0 }),\n      editProject: () => { this.setState({ step: 1 }); window.scrollTo(0, 0); },\n      projectId: \"#SI-\" + (s.pzip || \"83340\") + \"-4172\",\n      summaryTitle: (s.type || \"Sauna install\") + \" install\",\n      sizeLine,\n      notesSummary: s.notes.trim() ? s.notes.trim() : \"No special notes added — installers will ask if they need more detail.\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
