document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

onName }}\" style=\"width: 100%; font-family: inherit; font-size: 16px; color: #272019; background: #FFFDF9; border: 1px solid {{ nameBorder }}; border-radius: 11px; padding: 13px 14px;\">\n            <span style=\"display: {{ nameErr }}; color: #C0492F; font-size: 12.5px; margin-top: 6px; font-weight: 600;\">Please enter your name.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-bottom: 16px;\">\n            <label style=\"display: block; font-size: 13.5px; font-weight: 600; color: #272019; margin-bottom: 7px;\">Email<\u002Flabel>\n            <input type=\"email\" placeholder=\"you@email.com\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"width: 100%; font-family: inherit; font-size: 16px; color: #272019; background: #FFFDF9; border: 1px solid {{ emailBorder }}; border-radius: 11px; padding: 13px 14px;\">\n            <span style=\"display: {{ emailErr }}; color: #C0492F; font-size: 12.5px; margin-top: 6px; font-weight: 600;\">Enter a valid email address.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-bottom: 16px;\">\n            <label style=\"display: block; font-size: 13.5px; font-weight: 600; color: #272019; margin-bottom: 7px;\">Phone <span style=\"color: #8A8071; font-weight: 400;\">(optional)<\u002Fspan><\u002Flabel>\n            <input inputmode=\"tel\" placeholder=\"(208) 555-0142\" style=\"width: 100%; font-family: inherit; font-size: 16px; color: #272019; background: #FFFDF9; border: 1px solid #D8C8AF; border-radius: 11px; padding: 13px 14px;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: {{ showDone }}; animation: fade .25s ease;\">\n          <div style=\"text-align: center; padding: 16px 8px 8px;\">\n            <div style=\"width: 70px; height: 70px; border-radius: 50%; background: #E9F1EA; border: 1px solid #CFE3D3; display: grid; place-items: center; margin: 0 auto 18px; color: #3E7A4E;\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"width: 34px; height: 34px;\"><path d=\"M5 12.5l4.5 4.5L19 7\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <h3 style=\"font-size: 26px; margin: 0; line-height: 1.05; letter-spacing: -.025em; font-weight: 700;\">You're matched.<\u002Fh3>\n            <p style=\"color: #6B6253; font-size: 16px; margin: 12px auto 0; max-width: 30ch;\">{{ successSub }}<\u002Fp>\n            <div style=\"margin: 22px 0 4px; display: grid; gap: 10px; text-align: left;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 12px; padding: 12px 14px;\">\n                <div style=\"width: 40px; height: 40px; border-radius: 10px; flex: none; border: 1px solid #D8C8AF; background: linear-gradient(135deg, #B98B53, #8A5424);\"><\u002Fdiv>\n                <div><div style=\"font-size: 14.5px; font-weight: 700;\">Northwood Sauna Co.<\u002Fdiv><div style=\"font-size: 12.5px; color: #6B6253;\">12 mi · 4.9 ★ · 86 installs<\u002Fdiv><\u002Fdiv>\n                <span style=\"margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #3E7A4E; background: #E9F1EA; border: 1px solid #CFE3D3; padding: 3px 8px; border-radius: 999px;\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" style=\"width: 12px; height: 12px;\"><path d=\"M3 8.5l3.2 3.2L13 5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 12px; background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 12px; padding: 12px 14px;\">\n                <div style=\"width: 40px; height: 40px; border-radius: 10px; flex: none; border: 1px solid #D8C8AF; background: linear-gradient(135deg, #9DA98C, #5E6B4A);\"><\u002Fdiv>\n                <div><div style=\"font-size: 14.5px; font-weight: 700;\">Cedar &amp; Stone Build<\u002Fdiv><div style=\"font-size: 12.5px; color: #6B6253;\">19 mi · 5.0 ★ · 54 installs<\u002Fdiv><\u002Fdiv>\n                <span style=\"margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #3E7A4E; background: #E9F1EA; border: 1px solid #CFE3D3; padding: 3px 8px; border-radius: 999px;\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" style=\"width: 12px; height: 12px;\"><path d=\"M3 8.5l3.2 3.2L13 5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 12px; padding: 8px 26px 26px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"display: {{ backDisplay }}; align-items: center; justify-content: center; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid #D8C8AF; padding: 13px 22px; background: transparent; color: #272019;\" style-hover=\"background: #F4ECE0;\">Back<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"flex: 1; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 11px; border: 1px solid transparent; padding: 13px 22px; background: #8A5424; color: #fff;\" style-hover=\"background: #6F421A;\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-m=\"bar\" style=\"display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: rgba(255,253,249,.97); backdrop-filter: blur(12px); border-top: 1px solid #E4D8C5; box-shadow: 0 -8px 24px -14px rgba(42,34,25,.3); padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); grid-template-columns: 1fr 1fr 1fr 1.8fr; gap: 4px; align-items: center;\">\n    <a href=\"/#how\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; font-size: 11.5px; font-weight: 600; color: #6B6253; cursor: pointer; text-align: center;\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"width: 22px; height: 22px; color: #8A5424;\"><path d=\"M9 6h11M9 12h11M9 18h11\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"4.5\" cy=\"6\" r=\"1.3\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"4.5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"4.5\" cy=\"18\" r=\"1.3\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>How it works<\u002Fa>\n    <a href=\"/contractors\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; font-size: 11.5px; font-weight: 600; color: #6B6253; cursor: pointer; text-align: center;\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"width: 22px; height: 22px; color: #8A5424;\"><rect x=\"3\" y=\"7.5\" width=\"18\" height=\"12\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Frect><path d=\"M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 13h18\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Contractors<\u002Fa>\n    <details style=\"position: relative;\">\n      <summary style=\"list-style: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; font-size: 11.5px; font-weight: 600; color: #6B6253; cursor: pointer; text-align: center;\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"width: 22px; height: 22px; color: #8A5424;\"><circle cx=\"12\" cy=\"8.5\" r=\"3.8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fcircle><path d=\"M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Log in<\u002Fsummary>\n      <div style=\"position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); width: 224px; background: #FFFDF9; border: 1px solid #E4D8C5; border-radius: 14px; box-shadow: 0 20px 44px -16px rgba(42,34,25,.4); padding: 7px; display: grid; gap: 2px;\">\n        <a href=\"/list-project#login\" style=\"padding: 13px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #272019; display: block;\" style-hover=\"background: #F4ECE0; color: #8A5424;\">Sauna owner log in<\u002Fa>\n        <a href=\"/contractors#login\" style=\"padding: 13px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #272019; display: block;\" style-hover=\"background: #F4ECE0; color: #8A5424;\">Contractor log in<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdetails>\n    <a href=\"/list-project\" style=\"display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; border-radius: 12px; background: #8A5424; color: #FFFFFF; font-size: 14.5px; font-weight: 700; line-height: 1.15; padding: 0 10px; text-align: center;\" style-hover=\"background: #6F421A; color: #FFFFFF;\"><svg sc-camel-view-box=\"0 0 20 20\" fill=\"none\" style=\"width: 16px; height: 16px; flex: none;\"><path d=\"M10 4v12M4 10h12\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>List your project<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;matchBtnBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8B23A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#E8B23A&quot;,&quot;#8A5424&quot;,&quot;#3E7A4E&quot;,&quot;#272019&quot;],&quot;section&quot;:&quot;Hero&quot;},&quot;showBrandStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    faq: -1, modalOpen: false, idx: 0,\n    heroZip: \"\", heroType: \"\", zip: \"\", type: \"\", name: \"\", email: \"\",\n    errZip: false, errType: false, errName: false, errEmail: false,\n    successSub: \"We found verified installers near you. Expect bids within 48 hours.\"\n  };\n\n  digits(v) { return v.replace(/\\D/g, \"\").slice(0, 5); }\n\n  validate() {\n    const s = this.state;\n    if (s.idx === 0) {\n      const errZip = !/^\\d{5}$/.test(s.zip.trim());\n      const errType = !s.type;\n      if (errZip || errType) { this.setState({ errZip, errType }); return false; }\n    }\n    if (s.idx === 2) {\n      const errName = !s.name.trim();\n      const errEmail = !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.email.trim());\n      if (errName || errEmail) { this.setState({ errName, errEmail }); return false; }\n    }\n    return true;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const chipVals = [\n      [\"Barrel\", \"Barrel sauna\"], [\"Outdoor cabin\", \"Outdoor cabin\"], [\"Indoor\", \"Indoor sauna\"],\n      [\"Infrared\", \"Infrared\"], [\"Not sure yet\", \"Not sure yet\"]\n    ];\n    const qa = [\n      [\"Does it cost anything to get quotes?\", \"No. saunainstall is completely free for homeowners — from submitting your project to choosing an installer. There's no fee and no commission added to your install. Installers pay a small fee to bid on jobs they're matched to.\"],\n      [\"How are installers vetted?\", \"Before any pro can bid, we verify their contractor license, active insurance, and customer references. We also confirm hands-on experience with the specific sauna types and brands they list — so the person who shows up has actually built what you bought.\"],\n      [\"How fast will I hear back?\", \"Most homeowners receive their first bid within a few hours and a full set of competitive quotes within 48 hours. Timing depends on installer availability in your area, which we'll show you up front.\"],\n      [\"What if I haven't bought my sauna yet?\", \"That's fine — choose \\u201cNot sure yet\\u201d when you start. A matched installer can advise on models that suit your space and budget, and quote installation alongside it.\"],\n      [\"Will my manufacturer warranty stay valid?\", \"Yes. Our installers follow manufacturer specifications so your warranty stays intact, and the workmanship itself is backed by a guarantee. If anything's off, we help you make it right.\"],\n      [\"Do I have to accept a quote?\", \"Never. There's no obligation to hire anyone. Compare your bids, decline the ones that don't fit with one click, and only move forward if a pro is right for you.\"]\n    ];\n    const done = s.idx === 3;\n    return {\n      matchBtnBg: this.props.matchBtnBg ?? \"#E8B23A\",\n      showBrandStrip: this.props.showBrandStrip ?? true,\n      types: [\n        { img: \"images/circle-full.jpg\", fit: \"cover\", blur: \"none\", ph: \"barrel sauna\", title: \"Barrel saunas\", body: \"Cradles, banding, and roofing dialed in for stable, leak-free assembly.\" },\n        { img: \"images/arch-full-quarter.jpg\", fit: \"cover\", blur: \"none\", ph: \"outdoor cabin\", title: \"Outdoor cabins\", body: \"Foundations, framing, and weatherproofing for year-round backyard use.\" },\n        { img: \"images/show-full-assembly.jpg\", fit: \"contain\", blur: \"block\", ph: \"indoor sauna\", title: \"Indoor saunas\", body: \"Framing, vapor barrier, and clearances handled to code in any room.\" },\n        { img: \"images/blue-full-assembly.jpg\", fit: \"contain\", blur: \"block\", ph: \"infrared cabin\", title: \"Infrared cabins\", body: \"Simple placement plus the dedicated circuit your heater needs.\" }\n      ],\n      pros: [\n        { name: \"Northwood Sauna Co.\", loc: \"Ketchum, ID · 12 mi away\", rating: \"4.9\", installs: 86, tags: [\"Barrel\", \"Outdoor cabin\", \"Wood-fired\"], avatar: \"linear-gradient(135deg, #B98B53, #8A5424)\" },\n        { name: \"Cedar & Stone Build\", loc: \"Bend, OR · 19 mi away\", rating: \"5.0\", installs: 54, tags: [\"Indoor\", \"Infrared\", \"Electrical\"], avatar: \"linear-gradient(135deg, #9DA98C, #5E6B4A)\" },\n        { name: \"Summit Thermal Works\", loc: \"Boise, ID · 24 mi away\", rating: \"4.8\", installs: 120, tags: [\"Barrel\", \"Indoor\", \"Permitting\"], avatar: \"linear-gradient(135deg, #C99A9A, #8A5252)\" }\n      ],\n      faqs: qa.map(([q, a], i) => ({\n        q, a,\n        vBar: s.faq === i ? 0 : 1,\n        maxHeight: s.faq === i ? \"320px\" : \"0px\",\n        toggle: () => this.setState(st => ({ faq: st.faq === i ? -1 : i }))\n      })),\n      heroZip: s.heroZip,\n      heroType: s.heroType,\n      onHeroZip: e => this.setState({ heroZip: this.digits(e.target.value) }),\n      onHeroType: e => this.setState({ heroType: e.target.value }),\n      openModal: () => this.setState({\n        modalOpen: true, idx: 0,\n        zip: this.state.heroZip || this.state.zip,\n        type: this.state.heroType || this.state.type,\n        errZip: false, errType: false, errName: false, errEmail: false\n      }),\n      closeModal: () => this.setState({ modalOpen: false }),\n      onOverlayClick: () => this.setState({ modalOpen: false }),\n      stop: e => e.stopPropagation(),\n      overlayDisplay: s.modalOpen ? \"flex\" : \"none\",\n      progress: [33, 66, 100, 100][s.idx] + \"%\",\n      show1: s.idx === 0 ? \"block\" : \"none\",\n      show2: s.idx === 1 ? \"block\" : \"none\",\n      show3: s.idx === 2 ? \"block\" : \"none\",\n      showDone: done ? \"block\" : \"none\",\n      backDisplay: (s.idx === 0 || done) ? \"none\" : \"inline-flex\",\n      nextLabel: done ? \"Done\" : (s.idx === 2 ? \"Get my bids\" : \"Continue\"),\n      zip: s.zip,\n      onZip: e => this.setState({ zip: this.digits(e.target.value), errZip: false }),\n      zipErr: s.errZip ? \"block\" : \"none\",\n      zipBorder: s.errZip ? \"#C0492F\" : \"#D8C8AF\",\n      typeErr: s.errType ? \"block\" : \"none\",\n      chips: chipVals.map(([label, val]) => ({\n        label,\n        fg: s.type === val ? \"#fff\" : \"#272019\",\n        bg: s.type === val ? \"#8A5424\" : \"#FFFDF9\",\n        bd: s.type === val ? \"#8A5424\" : \"#D8C8AF\",\n        pick: () => this.setState({ type: val, errType: false })\n      })),\n      name: s.name,\n      onName: e => this.setState({ name: e.target.value, errName: false }),\n      nameErr: s.errName ? \"block\" : \"none\",\n      nameBorder: s.errName ? \"#C0492F\" : \"#D8C8AF\",\n      email: s.email,\n      onEmail: e => this.setState({ email: e.target.value, errEmail: false }),\n      emailErr: s.errEmail ? \"block\" : \"none\",\n      emailBorder: s.errEmail ? \"#C0492F\" : \"#D8C8AF\",\n      successSub: s.successSub,\n      back: () => this.setState(st => ({ idx: Math.max(0, st.idx - 1) })),\n      next: () => {\n        if (this.state.idx === 3) { this.setState({ modalOpen: false }); return; }\n        if (!this.validate()) return;\n        const nextIdx = this.state.idx + 1;\n        const patch = { idx: nextIdx };\n        if (nextIdx === 3) patch.successSub = \"We found verified installers near \" + this.state.zip + \". Expect competitive bids within 48 hours.\";\n        this.setState(patch);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
